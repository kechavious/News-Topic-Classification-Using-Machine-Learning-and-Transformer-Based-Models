name: Preprint statistical audit

on:
  push:
    branches: [preprint-v1]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.0.2' 'pandas==2.2.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'matplotlib==3.9.2' 'datasets==4.8.4'
      - name: Run paired statistical audit
        run: |
          python src/research_analysis.py --output-dir runs/preprint-ci-audit
          python src/overlap_analysis.py --output-dir runs/preprint-ci-overlap
      - name: Verify reference statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("runs/preprint-ci-audit")
          files = list(path.rglob("*.json"))
          assert files, "No audit JSON artifacts produced"
          report = json.loads((path / "paired_statistics.json").read_text())
          assert report["n_examples"] == 7600, report["n_examples"]
          assert report["overlap"] == {
              "both_correct": 6862,
              "lr_wrong_bert_correct": 301,
              "bert_wrong_lr_correct": 115,
              "both_wrong": 322,
          }, report["overlap"]
          assert abs(report["accuracy_difference_bert_minus_lr"] - 186/7600) < 1e-12
          assert abs(report["metrics"]["bert"]["accuracy"] - 0.9425) < 1e-12
          assert abs(report["metrics"]["logistic_regression"]["accuracy"] - (1 - 623/7600)) < 1e-12
          print("Historical paired statistics verified:", report["overlap"])
          PY
      - name: Upload independent audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprint-paired-audit
          path: |
            runs/preprint-ci-audit/
            runs/preprint-ci-overlap/
          if-no-files-found: warn
